<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Préalerte SPVE et Réserves BMC</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* --- DESIGN MODERNISÉ --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            background-color: #ffffff; 
            margin: 0; 
            color: #333; 
            -webkit-font-smoothing: antialiased;
        }

        /* Conteneur principal simulant un écran de smartphone */
        .app-container {
            max-width: 450px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        /* En-tête avec Logo */
        .header-section {
            margin-top: 10px; 
            margin-bottom: 30px;
        }
        .header-section img { height: 80px; width: auto; drop-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        .header-section h1 { color: #1a237e; margin-top: 15px; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }

        /* Champ de saisie du nom */
        .input-nom {
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-transform: uppercase;
            text-align: center;
            font-weight: bold;
            color: #1a237e;
            transition: all 0.3s ease;
            outline: none;
            background-color: #f9f9f9;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .input-nom:focus { border-color: #1a237e; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.1); }

        /* Grille de boutons ergonomique */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .btn-full { grid-column: span 2; }

        .btn { 
            padding: 16px 10px; 
            font-size: 15px; 
            border-radius: 12px; 
            border: none; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        
        /* Couleurs opérationnelles affinées */
        .btn-imm { background: linear-gradient(135deg, #2e7d32, #1b5e20); font-size: 18px; padding: 20px 10px; }
        .btn-t1h { background: linear-gradient(135deg, #afb42b, #827717); }
        .btn-t2h { background: linear-gradient(135deg, #fdd835, #fbc02d); color: #333; }
        .btn-t3h { background: linear-gradient(135deg, #fb8c00, #f57c00); }
        .btn-tplus3h { background: linear-gradient(135deg, #e64a19, #d84315); }
        .btn-indispo { background: linear-gradient(135deg, #e53935, #c62828); }

        /* Zone d'alerte clignotante */
        @keyframes pulse-rouge { 
            0% { background-color: #d32f2f; box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); } 
            70% { background-color: #b71c1c; box-shadow: 0 0 0 15px rgba(211, 47, 47, 0); } 
            100% { background-color: #d32f2f; box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); } 
        }
        .zone-urgence { 
            display: none; color: white; padding: 20px; border-radius: 12px; 
            margin-bottom: 25px; animation: pulse-rouge 2s infinite; 
        }

        /* Bouton Acquittement */
        @keyframes pulse-vert { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(18, 140, 126, 0.7); } 
            70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(18, 140, 126, 0); } 
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(18, 140, 126, 0); } 
        }
        .btn-ack { 
            background: linear-gradient(135deg, #25D366, #128C7E); font-size: 18px; padding: 20px; 
            animation: pulse-vert 2s infinite; margin-top: 20px; width: 100%; box-sizing: border-box;
        }

        .msg-succes { display: none; background: #f0fdf4; color: #166534; padding: 25px 20px; border-radius: 12px; margin-top: 20px; border: 2px solid #bbf7d0; }
        .titre-dispo { color: #555; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: bold; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="app-container">
    
    <div class="header-section">
        <img src="icon.png" alt="Logo COZ Sud-Est">
        <h1>Préalerte & Prospection</h1>
    </div>

    <div id="zone-alerte" class="zone-urgence">
        <h2 style="margin:0; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px;">
            ⚠️ PROSPECTION EN COURS
        </h2>
        <p id="texte-motif" style="font-size: 18px; font-weight: bold; margin-top: 10px; margin-bottom: 0;"></p>
    </div>

    <div id="zone-formulaire">
        <input type="text" id="nom" class="input-nom" placeholder="VOTRE NOM (EX: SGT DUPONT)">
        
        <div class="titre-dispo">Sélectionnez votre disponibilité</div>
        
        <button class="btn btn-imm btn-full" onclick="envoyerReponse('Immédiat')">⚡ IMMÉDIAT</button>
        
        <div class="btn-grid">
            <button class="btn btn-t1h" onclick="envoyerReponse('T+1h')">⏱️ T + 1h</button>
            <button class="btn btn-t2h" onclick="envoyerReponse('T+2h')">⏱️ T + 2h</button>
            <button class="btn btn-t3h" onclick="envoyerReponse('T+3h')">⏱️ T + 3h</button>
            <button class="btn btn-tplus3h" onclick="envoyerReponse('T>3h')">⏱️ T > 3h</button>
        </div>

        <button class="btn btn-indispo btn-full" onclick="envoyerReponse('Indisponible')">❌ INDISPONIBLE</button>
    </div>

    <div id="zone-acquittement" style="display: none;">
        <div style="background: #fff3f3; padding: 20px; border-radius: 12px; border: 2px solid #ffcdd2; margin-top: 10px;">
            <h2 style="color: #d32f2f; margin-top: 0; display: flex; justify-content: center; align-items: center; gap: 8px;">
                🚒 DÉPART RETENU
            </h2>
            <p style="font-size: 16px; font-weight: bold; color: #424242; margin-bottom: 0;">Le Chef de Garde a confirmé votre départ.</p>
        </div>
        <button class="btn btn-ack" onclick="validerAcquittement()">✅ ACQUITTER MON DÉPART</button>
    </div>

    <div id="message-confirmation" class="msg-succes">
        <h2 id="titre-succes" style="margin-top: 0; color: #15803d; font-size: 20px;">✅ Réponse Transmise</h2>
        <p id="texte-succes" style="font-size: 15px; font-weight: bold; margin-bottom: 0; line-height: 1.5;">
            Veuillez surveiller WhatsApp.<br>
            La confirmation du COZ sera envoyée sur le groupe ! 📱
        </p>
    </div>

</div>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) { registration.unregister(); }
        });
    }

    const firebaseConfig = {
        apiKey: "AIzaSyD3Ris9pwHSnvpXGSgIDIUztC05Apg47jU",
        authDomain: "alerte-spve-coz-se.firebaseapp.com",
        databaseURL: "https://alerte-spve-coz-se-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "alerte-spve-coz-se",
        storageBucket: "alerte-spve-coz-se.firebasestorage.app",
        messagingSenderId: "681070251949",
        appId: "1:681070251949:web:1ddec547160937a9f29b24"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let uidPompier = null;

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        uidPompier = urlParams.get('uid');

        if (uidPompier) {
            document.getElementById('zone-formulaire').style.display = 'none';
            document.getElementById('zone-alerte').style.display = 'none';
            document.getElementById('zone-acquittement').style.display = 'block';
        } else {
            let nomSauvegarde = localStorage.getItem("nomPompier");
            if (nomSauvegarde) document.getElementById('nom').value = nomSauvegarde;
        }
    };

    function validerAcquittement() {
        if(!uidPompier) return;
        
        database.ref('reponses/' + uidPompier).update({ acquitte: true })
        .then(() => {
            document.getElementById('zone-acquittement').style.display = 'none';
            document.getElementById('titre-succes').innerText = "✅ Départ Acquitté";
            document.getElementById('texte-succes').innerHTML = "Le COZ est informé que vous êtes en route.<br><br>Prudence sur le trajet ! 🚒";
            document.getElementById('message-confirmation').style.display = 'block';
        })
        .catch((err) => alert("Erreur de connexion : " + err));
    }

    function envoyerReponse(statut) {
        let nom = document.getElementById('nom').value;
        if(!nom) { 
            // Petit effet visuel si on oublie le nom
            document.getElementById('nom').style.borderColor = "#d32f2f";
            document.getElementById('nom').classList.add('shake');
            setTimeout(() => { document.getElementById('nom').style.borderColor = "#e0e0e0"; }, 1500);
            return; 
        }
        
        localStorage.setItem("nomPompier", nom);
        let heure = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        
        database.ref('reponses').push({ nom: nom, statut: statut, heure: heure })
        .then(() => {
            document.getElementById('zone-formulaire').style.display = 'none';
            document.getElementById('message-confirmation').style.display = 'block';
            window.scrollTo(0, 0);
        })
        .catch((err) => alert("Erreur de connexion : " + err));
    }

    database.ref('alertes').on('child_added', (snap) => {
        let a = snap.val();
        if (a.timestamp > Date.now() - 600000 && !uidPompier) { 
            document.getElementById('zone-alerte').style.display = 'block';
            document.getElementById('texte-motif').innerText = a.motif;
        }
    });
</script>
</body>
</html>
